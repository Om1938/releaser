name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  backend:
    name: Backend build, format & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Releaser.slnx --locked-mode
      - run: dotnet format Releaser.slnx --verify-no-changes --no-restore
      - run: dotnet build Releaser.slnx --no-restore -c Release
      - name: OpenAPI document is up to date
        run: git diff --exit-code web/openapi/openapi.json
      - name: Vulnerable packages
        run: |
          dotnet list Releaser.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - run: dotnet test --project tests/Releaser.Domain.Tests --no-build -c Release
      - run: dotnet test --project tests/Releaser.Electron.Tests --no-build -c Release
      - run: dotnet test --project tests/Releaser.Server.Tests --no-build -c Release   # Testcontainers: PostgreSQL 18 + Redis

  web:
    name: Dashboard lint, types, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typed API client is up to date
        run: pnpm api:generate && git diff --exit-code src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: Electron contract & admin E2E (+ accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: releaser
          POSTGRES_PASSWORD: releaser
          POSTGRES_DB: releaser
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U releaser" --health-interval 5s --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      ConnectionStrings__Releaser: Host=localhost;Port=55432;Database=releaser;Username=releaser;Password=releaser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Start Releaser
        run: |
          dotnet run --project src/Releaser.Server --no-launch-profile > server.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:5080/health/ready; do sleep 2; done'
      - name: electron-updater contract
        working-directory: tests/updater-contract
        run: npm ci && npm test
      - name: Playwright
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            server.log
            web/playwright-report
            web/test-results

  image:
    name: Container image (multi-arch) & demo acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the demo (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: releaser:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: PRD acceptance against the container
        run: |
          docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml up -d --wait
          docker compose --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml run --rm demo
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name == 'push'
        name: Publish multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
