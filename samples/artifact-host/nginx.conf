# Stand-in for a publisher's external artifact host / CDN. Serves manifests and files as static content.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  types {
    text/yaml yml;
    application/octet-stream exe zip AppImage blockmap;
  }
  location / {
    autoindex on;
    add_header Cache-Control "public, max-age=60";
  }
}
